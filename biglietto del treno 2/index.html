<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script defer src="script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="container">
        <!--Form-->
        <section id="form-section" class="m-5">
          <div class="card bg-danger text-white">
            <form>
              <div class="card-body">
                <h3 class="card-title">Inserisci i tuoi dati!</h3>
                <hr />
                <div class="row row-cols-md-3">
                  <div class="col mb-3">
                    <label for="name" class="form-label">Nome:</label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      placeholder="Nome"
                    />
                  </div>

                  <div class="col mb-3">
                    <label for="kms" class="form-label">Chilometri:</label>
                    <input
                      type="number"
                      class="form-control"
                      id="kms"
                      min="10"
                      max="300"
                      step="1"
                      value="10"
                    />
                  </div>

                  <div class="col mb-3">
                    <label for="name" class="form-label">Fascia d'età:</label>
                    <select id="age" class="form-select">
                      <option value="">Adulto</option>
                      <option value="junior">Minorenne</option>
                      <option value="senior">Over 65</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="card-footer d-flex justify-content-end gap-3">
                <button
                  class="btn btn-primary"
                  type="submit"
                  id="confirm-button"
                >
                  Conferma
                </button>
                <button class="btn btn-danger" type="reset">Annulla</button>
              </div>
            </form>
          </div>
        </section>
        <!--Biglietto-->
        <section id="ticket-section" class="m-5 d-none">
          <div class="card mb-3 bg-danger text-white">
            <div class="row g-0">
              <div class="col-md-4">
                <img
                  src="./how-do-diesel-electric-trains-work-and-why-do-they-need-turbochargers-2880x1920.jpeg"
                  alt="train"
                  class="img-fluid rounded-start"
                />
              </div>
              <div class="col-md-8">
                <div class="card-body">
                  <h5 class="card-title">Il tuo biglietto</h5>
                  <hr />
                  <h4 id="passenger-name">Daniele Innamorato</h4>
                  <div class="row row-cols-md-4">
                    <div class="col">
                      <h6>Tariffa</h6>
                      <div id="rate">Adulto</div>
                    </div>
                    <div class="col">
                      <h6>Carrozza</h6>
                      <div id="car">8</div>
                    </div>
                    <div class="col">
                      <h6>Codice passeggero</h6>
                      <div id="pnr">99999</div>
                    </div>
                    <div class="col">
                      <h6>Totale</h6>
                      <div id="price">20€</div>
                    </div>
                  </div>
                  <p class="text-muted mb-3">
                    Ho letto e accettato termini e condizioni
                  </p>
                  <div>Visualizza <a href="#">termini e condizioni</a></div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
